[provider]
active_profile = "openai"

[[provider.profiles]]
name = "openai"
kind = "openai"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[[provider.profiles]]
name = "anthropic"
kind = "anthropic"
model = "claude-sonnet-5"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# ChatGPT subscription (Codex backend). The credential is whatever
# `codex login` left in ~/.codex/auth.json, so there is no api_key_env.
[[provider.profiles]]
name = "codex"
kind = "codex"
model = "gpt-5.5"

# DeepSeek serves the same models behind both wire formats, which makes it the
# cheapest way to exercise either provider end to end.
[[provider.profiles]]
name = "deepseek"
kind = "openai"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[[provider.profiles]]
name = "deepseek-anthropic"
kind = "anthropic"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "DEEPSEEK_API_KEY"

[[provider.profiles]]
name = "scripted"
kind = "scripted"
model = "scripted-demo"

[registry]
max_tools = 8
pinned_native_tools = []

[registry.weights]
uses_recent = 1.0
uses_total = 0.25
last_used = 0.5
success_rate = 1.0

[policy]
hook = "auto"

[environment]
backend = "local"
shell = "auto"

[compaction]
max_input_tokens = 80000
target_input_tokens = 40000

[extensions]
paths = []
